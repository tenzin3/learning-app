<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibetan Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .flashcard {
            transition: all 0.3s ease;
        }
        .flashcard:hover {
            transform: scale(1.05);
        }
        .flashcard:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100">
    <div class="container mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-4xl md:text-5xl font-bold text-indigo-800">Tibetan Flashcards</h1>
                <p class="text-gray-600 mt-2">Explore both alphabets and numbers in one place.</p>
            </div>
            <div class="flex gap-2 flex-wrap">
                <a href="quiz.html" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition-all hover:scale-105">
                    Take Quiz →
                </a>
                <a href="practice.html" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition-all hover:scale-105">
                    Pronunciation →
                </a>
            </div>
        </div>

        <section class="mb-10">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold text-indigo-800">Tibetan Alphabets</h2>
                <a href="quiz.html?mode=alphabets" class="text-indigo-600 hover:text-indigo-800 font-semibold">Try alphabet quiz →</a>
            </div>
            <div id="alphabet-flashcards" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold text-amber-800">Tibetan Numbers</h2>
                <a href="quiz.html?mode=numbers" class="text-amber-700 hover:text-amber-900 font-semibold">Try number quiz →</a>
            </div>
            <div id="number-flashcards" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>
    </div>

    <script>
        const alphabetData = [
            { tibetan: 'ཀ་', phonetic: 'ka' },
            { tibetan: 'ཁ་', phonetic: 'kha' },
            { tibetan: 'ག་', phonetic: 'ga' },
            { tibetan: 'ང་།', phonetic: 'nga' },
            { tibetan: 'ཅ་', phonetic: 'ca' },
            { tibetan: 'ཆ་', phonetic: 'cha' },
            { tibetan: 'ཇ་', phonetic: 'ja' },
            { tibetan: 'ཉ།', phonetic: 'nya' },
            { tibetan: 'ཏ་', phonetic: 'ta' },
            { tibetan: 'ཐ་', phonetic: 'tha' },
            { tibetan: 'ད་', phonetic: 'da' },
            { tibetan: 'ན།', phonetic: 'na' },
            { tibetan: 'པ་', phonetic: 'pa' },
            { tibetan: 'ཕ་', phonetic: 'pha' },
            { tibetan: 'བ་', phonetic: 'ba' },
            { tibetan: 'མ།', phonetic: 'ma' },
            { tibetan: 'ཙ་', phonetic: 'tsa' },
            { tibetan: 'ཚ་', phonetic: 'tsha' },
            { tibetan: 'ཛ་', phonetic: 'dza' },
            { tibetan: 'ཝ།', phonetic: 'wa' },
            { tibetan: 'ཞ་', phonetic: 'zha' },
            { tibetan: 'ཟ་', phonetic: 'za' },
            { tibetan: 'འ་', phonetic: "'a" },
            { tibetan: 'ཡ།', phonetic: 'ya' },
            { tibetan: 'ར་', phonetic: 'ra' },
            { tibetan: 'ལ་', phonetic: 'la' },
            { tibetan: 'ཤ་', phonetic: 'sha' },
            { tibetan: 'ས།', phonetic: 'sa' },
            { tibetan: 'ཧ་', phonetic: 'ha' },
            { tibetan: 'ཨ།', phonetic: 'a' }
        ];

        const numberData = [
            { numeral: '༡', word: 'གཅིག་', phonetic: 'one', audio: '༡-གཅིག-1.wav' },
            { numeral: '༢', word: 'གཉིས།', phonetic: 'two', audio: '༢-གཉིས།-2.wav' },
            { numeral: '༣', word: 'གསུམ།', phonetic: 'three', audio: '༣-གསུམ།-3.wav' },
            { numeral: '༤', word: 'བཞི།', phonetic: 'four', audio: '༤-བཞི།-4.wav' },
            { numeral: '༥', word: 'ལྔ་།', phonetic: 'five', audio: '༥-ལྔ་།-5.wav' },
            { numeral: '༦', word: 'དྲུག', phonetic: 'six', audio: '༦-དྲུག-6.wav' },
            { numeral: '༧', word: 'བདུན།', phonetic: 'seven', audio: '༧-བདུན།-7.wav' },
            { numeral: '༨', word: 'བརྒྱད།', phonetic: 'eight', audio: '༨-བརྒྱད།-8.wav' },
            { numeral: '༩', word: 'དགུ་', phonetic: 'nine', audio: '༩-དགུ་-9.wav' },
            { numeral: '༡༠', word: 'བཅུ།', phonetic: 'ten', audio: '༡༠-བཅུ།-10.wav' },
            { numeral: '༡༡', word: 'བཅུ་གཅིག་', phonetic: 'eleven', audio: '༡༡-བཅུ་གཅིག་-11.wav' },
            { numeral: '༡༢', word: 'བཅུ་གཉིས།', phonetic: 'twelve', audio: '༡༢-བཅུ་གཉིས།-12.wav' },
            { numeral: '༡༣', word: 'བཅུ་གསུམ།', phonetic: 'thirteen', audio: '༡༣-བཅུ་གསུམ།-13.wav' },
            { numeral: '༡༤', word: 'བཅུ་བཞི།', phonetic: 'fourteen', audio: '༡༤-བཅུ་བཞི།-14.wav' },
            { numeral: '༡༥', word: 'བཅོ་ལྔ་།', phonetic: 'fifteen', audio: '༡༥-བཅོ་ལྔ་།-15.wav' },
            { numeral: '༡༦', word: 'བཅུ་དྲུག', phonetic: 'sixteen', audio: '༡༦-བཅུ་དྲུག-16.wav' },
            { numeral: '༡༧', word: 'བཅུ་བདུན།', phonetic: 'seventeen', audio: '༡༧-བཅུ་བདུན།-17.wav' },
            { numeral: '༡༨', word: 'བཅོ་བརྒྱད།', phonetic: 'eighteen', audio: '༡༨-བཅོ་བརྒྱད།-18.wav' },
            { numeral: '༡༩', word: 'བཅུ་དགུ་', phonetic: 'nineteen', audio: '༡༩-བཅུ་དགུ་-19.wav' },
            { numeral: '༢༠', word: 'ཉི་ཤུ།', phonetic: 'twenty', audio: '༢༠-ཉི་ཤུ།-20.wav' }
        ];

        function renderCards(containerId, data, type) {
            const container = document.getElementById(containerId);
            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'flashcard bg-white rounded-2xl shadow-lg p-6 cursor-pointer flex flex-col items-center justify-center aspect-square';
                if (type === 'alphabet') {
                    card.innerHTML = `
                        <span class="text-5xl md:text-6xl font-bold text-indigo-700">${item.tibetan}</span>
                        <span class="text-lg text-amber-600 font-semibold mt-2">${item.phonetic}</span>
                        <span class="text-sm text-gray-500 mt-1">${index + 1}</span>
                    `;
                    card.addEventListener('click', () => {
                        const audio = new Audio(`alphabets/${item.tibetan}.wav`);
                        audio.play().catch(error => console.error('Error playing alphabet audio:', error));
                    });
                } else {
                    card.innerHTML = `
                        <span class="text-5xl md:text-6xl font-bold text-amber-700">${item.numeral}</span>
                        <span class="text-lg text-rose-600 font-semibold mt-2">${item.phonetic}</span>
                        <span class="text-sm text-gray-500 mt-1">${item.word}</span>
                        <span class="text-sm text-gray-400 mt-1">${index + 1}</span>
                    `;
                    card.addEventListener('click', () => {
                        const audio = new Audio(`numbers/${item.audio}`);
                        audio.play().catch(error => console.error('Error playing number audio:', error));
                    });
                }
                container.appendChild(card);
            });
        }

        renderCards('alphabet-flashcards', alphabetData, 'alphabet');
        renderCards('number-flashcards', numberData, 'number');
    </script>
</body>
</html>
