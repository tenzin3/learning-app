<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tibetan Alphabet Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/listening-quiz.css" />
    <link rel="stylesheet" href="assets/css/page-navigation.css" />
    <script defer src="assets/js/data/alphabet.js"></script>
    <script defer src="assets/js/data/numbers.js"></script>
    <script defer src="assets/js/shared/random.js"></script>
    <script defer src="assets/js/shared/saved-progress.js"></script>
    <script defer src="assets/js/pages/listening-quiz.js"></script>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-emerald-100 via-teal-50 to-cyan-100"
  >
    <nav aria-label="Learning activities" class="page-navigation">
      <a href="learn.html">Learn</a><a href="activities.html#games">Games</a>
    </nav>
    <div class="container mx-auto px-4 py-8 max-w-2xl">
      <div class="flex justify-between items-center mb-6">
        <a
          href="learn.html"
          class="text-indigo-600 hover:text-indigo-800 font-semibold"
          >← Back to Learn</a
        >
      </div>

      <div class="text-center mb-6">
        <h1 class="text-4xl font-bold text-indigo-800 mb-2">Tibetan Quiz</h1>
        <p class="text-gray-600">
          Listen to the audio and select the correct answer.
        </p>
      </div>

      <div
        id="quiz-container"
        class="bg-white rounded-2xl shadow-xl p-8 hidden"
      >
        <div class="text-center mb-8">
          <button
            id="play-audio"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-full text-lg shadow-lg transition-all hover:scale-105"
          >
            🔊 Play Audio
          </button>
        </div>

        <div id="options" class="grid grid-cols-2 gap-4"></div>

        <div
          id="feedback"
          class="mt-6 text-center text-xl font-bold hidden"
        ></div>

        <div id="next-btn-container" class="mt-6 text-center hidden">
          <button
            id="next-btn"
            class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all"
          >
            Next Question →
          </button>
        </div>
      </div>

      <div id="results" class="bg-white rounded-2xl shadow-xl p-8 hidden">
        <h2 class="text-3xl font-bold text-center text-indigo-800 mb-4">
          Quiz Complete!
        </h2>
        <div class="text-center mb-6">
          <p class="text-6xl font-bold text-indigo-600 mb-2">
            <span id="final-score">0</span>/<span id="final-total">10</span>
          </p>
          <p class="text-gray-600" id="percentage">0%</p>
        </div>
        <div class="text-center">
          <button
            id="restart-btn"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all"
          >
            Try Again
          </button>
        </div>
      </div>
    </div>

    <p id="storage-status" role="status" class="storage-status"></p>
  </body>
</html>
