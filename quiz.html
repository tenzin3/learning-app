<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibetan Alphabet Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            transform: translateY(-2px);
        }
        .correct {
            background-color: #10b981 !important;
            color: white !important;
        }
        .incorrect {
            background-color: #ef4444 !important;
            color: white !important;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-100 via-teal-50 to-cyan-100">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="flex justify-between items-center mb-6">
            <a href="flashcards.html" class="text-indigo-600 hover:text-indigo-800 font-semibold">← Back to Flashcards</a>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-indigo-800 mb-2">Tibetan Quiz</h1>
            <p class="text-gray-600">Listen to the audio and select the correct answer.</p>
        </div>

        <div id="quiz-container" class="bg-white rounded-2xl shadow-xl p-8 hidden">
            <div class="text-center mb-8">
                <button id="play-audio" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-full text-lg shadow-lg transition-all hover:scale-105">
                    🔊 Play Audio
                </button>
            </div>

            <div id="options" class="grid grid-cols-2 gap-4"></div>

            <div id="feedback" class="mt-6 text-center text-xl font-bold hidden"></div>

            <div id="next-btn-container" class="mt-6 text-center hidden">
                <button id="next-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all">
                    Next Question →
                </button>
            </div>
        </div>

        <div id="results" class="bg-white rounded-2xl shadow-xl p-8 hidden">
            <h2 class="text-3xl font-bold text-center text-indigo-800 mb-4">Quiz Complete!</h2>
            <div class="text-center mb-6">
                <p class="text-6xl font-bold text-indigo-600 mb-2"><span id="final-score">0</span>/<span id="final-total">10</span></p>
                <p class="text-gray-600" id="percentage">0%</p>
            </div>
            <div class="text-center">
                <button id="restart-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all">
                    Try Again
                </button>
            </div>
        </div>
    </div>

    <script>
        const alphabets = [
            'ཀ་', 'ཁ་', 'ག་', 'ང་།', 'ཅ་', 'ཆ་', 'ཇ་', 'ཉ།', 'ཏ་', 'ཐ་', 'ད་', 'ན།', 'པ་', 'ཕ་', 'བ་', 'མ།', 'ཙ་', 'ཚ་', 'ཛ་', 'ཝ།', 'ཞ་', 'ཟ་', 'འ་', 'ཡ།', 'ར་', 'ལ་', 'ཤ་', 'ས།', 'ཧ་', 'ཨ།'
        ];

        const numbers = [
            '༡', '༢', '༣', '༤', '༥', '༦', '༧', '༨', '༩', '༡༠'
        ];

        let currentQuestion = 0;
        let score = 0;
        let totalQuestions = 10;
        let correctAnswer = '';
        let answered = false;
        let shuffledItems = [];
        let quizMode = 'alphabet';

        const quizContainer = document.getElementById('quiz-container');
        const resultsContainer = document.getElementById('results');
        const optionsContainer = document.getElementById('options');
        const playAudioBtn = document.getElementById('play-audio');
        const feedback = document.getElementById('feedback');
        const nextBtnContainer = document.getElementById('next-btn-container');
        const nextBtn = document.getElementById('next-btn');
        const finalScore = document.getElementById('final-score');
        const finalTotal = document.getElementById('final-total');
        const percentage = document.getElementById('percentage');
        const restartBtn = document.getElementById('restart-btn');

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function generateOptions(correctValue) {
            const pool = quizMode === 'number' ? numbers : alphabets;
            const options = [correctValue];
            const remaining = pool.filter(item => item !== correctValue);
            const shuffledRemaining = shuffleArray(remaining);

            while (options.length < 4 && shuffledRemaining.length > 0) {
                options.push(shuffledRemaining.pop());
            }

            return shuffleArray(options);
        }

        function loadQuestion() {
            if (currentQuestion >= totalQuestions) {
                showResults();
                return;
            }

            answered = false;
            feedback.classList.add('hidden');
            nextBtnContainer.classList.add('hidden');

            correctAnswer = shuffledItems[currentQuestion];
            const options = generateOptions(correctAnswer);

            optionsContainer.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn bg-gray-100 hover:bg-gray-200 text-2xl md:text-4xl font-bold text-indigo-700 py-6 rounded-xl shadow-md';
                btn.textContent = option;
                btn.addEventListener('click', () => checkAnswer(option, btn));
                optionsContainer.appendChild(btn);
            });

            setTimeout(() => playAudio(), 300);
        }

        function playAudio() {
            const audioPath = quizMode === 'number' ? `numbers/${correctAnswer}.wav` : `alphabets/${correctAnswer}.wav`;
            const audio = new Audio(audioPath);
            audio.play().catch(error => {
                console.error('Error playing audio:', error);
            });
        }

        function checkAnswer(selected, btn) {
            if (answered) return;
            answered = true;

            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                b.disabled = true;
                if (b.textContent === correctAnswer) {
                    b.classList.add('correct');
                }
            });

            if (selected === correctAnswer) {
                score++;
                feedback.textContent = '✓ Correct!';
                feedback.className = 'mt-6 text-center text-xl font-bold text-emerald-600';
            } else {
                btn.classList.add('incorrect');
                feedback.textContent = '✗ Incorrect';
                feedback.className = 'mt-6 text-center text-xl font-bold text-red-600';
            }

            feedback.classList.remove('hidden');
            nextBtnContainer.classList.remove('hidden');
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultsContainer.classList.remove('hidden');
            finalScore.textContent = score;
            finalTotal.textContent = totalQuestions;
            const percent = Math.round((score / totalQuestions) * 100);
            percentage.textContent = `${percent}% - ${percent >= 80 ? 'Excellent!' : percent >= 60 ? 'Good job!' : 'Keep practicing!'}`;
        }

        function startQuiz() {
            currentQuestion = 0;
            score = 0;
            shuffledItems = shuffleArray(quizMode === 'number' ? numbers : alphabets).slice(0, totalQuestions);
            quizContainer.classList.remove('hidden');
            resultsContainer.classList.add('hidden');
            loadQuestion();
        }

        function selectMode(mode) {
            quizMode = mode;
            quizContainer.classList.remove('hidden');
            resultsContainer.classList.add('hidden');
            startQuiz();
        }

        const params = new URLSearchParams(window.location.search);
        const initialMode = params.get('mode');
        if (initialMode === 'number') {
            selectMode('number');
        } else {
            selectMode('alphabet');
        }

        playAudioBtn.addEventListener('click', playAudio);
        nextBtn.addEventListener('click', () => {
            currentQuestion++;
            loadQuestion();
        });
        restartBtn.addEventListener('click', () => selectMode(quizMode));
    </script>
</body>
</html>
