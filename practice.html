<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tibetan Pronunciation Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/pronunciation.css" />
    <link rel="stylesheet" href="assets/css/page-navigation.css" />
    <script defer src="assets/js/data/alphabet.js"></script>
    <script defer src="assets/js/pages/pronunciation.js"></script>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-rose-100 via-pink-50 to-orange-100"
  >
    <nav aria-label="Learning activities" class="page-navigation">
      <a href="learn.html">Learn</a><a href="activities.html#games">Games</a>
    </nav>
    <div class="container mx-auto px-4 py-8 max-w-2xl">
      <div class="flex justify-between items-center mb-6">
        <a
          href="learn.html"
          class="text-indigo-600 hover:text-indigo-800 font-semibold"
          >← Back to Learn</a
        >
        <div class="text-lg font-bold text-indigo-800">
          Progress: <span id="progress">0</span>/30
        </div>
      </div>

      <h1 class="text-4xl font-bold text-center text-indigo-800 mb-2">
        Pronunciation Practice
      </h1>
      <p class="text-center text-gray-600 mb-8">
        Listen, record yourself, and compare
      </p>

      <div id="practice-container" class="bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
          <div id="character" class="text-8xl font-bold text-indigo-700 mb-4">
            ཀ་
          </div>
        </div>

        <div class="space-y-6">
          <!-- Reference Audio -->
          <div id="reference-section" class="bg-gray-50 rounded-xl p-4 hidden">
            <h3 class="text-lg font-semibold text-gray-700 mb-3">
              Reference Audio
            </h3>
            <button
              id="play-reference"
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all w-full"
            >
              🔊 Play Reference
            </button>
          </div>

          <!-- User Recording -->
          <div class="bg-gray-50 rounded-xl p-4">
            <h3 class="text-lg font-semibold text-gray-700 mb-3">
              Your Recording
            </h3>
            <div class="flex gap-2 mb-3">
              <button
                id="record-btn"
                class="flex-1 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all transform hover:scale-105"
              >
                <span class="flex items-center justify-center gap-2">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-6 w-6"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
                    />
                  </svg>
                  Record
                </span>
              </button>
              <button
                id="stop-btn"
                class="flex-1 bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all transform hover:scale-105 hidden"
              >
                <span class="flex items-center justify-center gap-2">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-6 w-6"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"
                    />
                  </svg>
                  Stop
                </span>
              </button>
            </div>
            <button
              id="play-recording"
              class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all w-full hidden"
            >
              <span class="flex items-center justify-center gap-2">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-6 w-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  />
                </svg>
                Play Your Recording
              </span>
            </button>
            <p id="recording-status" class="text-center text-gray-500 mt-2"></p>
          </div>

          <!-- Auto-Grade Result -->
          <div id="auto-grade-section" class="bg-gray-50 rounded-xl p-4 hidden">
            <h3 class="text-lg font-semibold text-gray-700 mb-3">
              Comparison Result
            </h3>
            <div id="similarity-score" class="text-center mb-3"></div>
            <div
              id="grade-result"
              class="text-center text-xl font-bold mb-3"
            ></div>
            <button
              id="next-btn"
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all w-full"
            >
              Next Character →
            </button>
          </div>
        </div>
      </div>

      <div id="results" class="bg-white rounded-2xl shadow-xl p-8 hidden">
        <h2 class="text-3xl font-bold text-center text-indigo-800 mb-4">
          Practice Complete!
        </h2>
        <div class="text-center mb-6">
          <p class="text-6xl font-bold text-indigo-600 mb-2">
            <span id="correct-count">0</span>/30
          </p>
          <p class="text-gray-600">Correct pronunciations</p>
        </div>
        <div class="text-center">
          <button
            id="restart-btn"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all"
          >
            Practice Again
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
